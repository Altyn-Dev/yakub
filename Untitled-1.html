<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Турагентство Кашалот</title>

<style>
/* =========================
   ОСНОВНЫЕ СТИЛИ
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --black: #050505;
    --gray: #d9d9d9;
    --light-gray: #f2f2f2;
    --text-gray: #555;
}

body {
    min-height: 100vh;
    background: #fff;
    color: var(--black);
    font-family: Arial, Helvetica, sans-serif;
}

button,
input {
    font: inherit;
}

button {
    border: none;
    background: none;
    color: inherit;
    cursor: pointer;
}


/* =========================
   ОСНОВНОЙ КОНТЕЙНЕР
========================= */

.app {
    width: min(100%, 1100px);
    min-height: 100vh;
    margin: 0 auto;
    padding: 28px 24px 110px;
}


/* =========================
   ЗАГОЛОВОК
========================= */

.header {
    text-align: center;
}

.header h1 {
    font-size: 28px;
    line-height: 0.98;
    font-weight: 800;
    margin-bottom: 18px;
}


/* =========================
   ПОИСК
========================= */

.search-wrap {
    width: min(100%, 380px);
    height: 42px;

    margin: 0 auto;

    display: flex;
    align-items: center;

    border: 1.8px solid #111;
    border-radius: 999px;

    overflow: hidden;
    background: #fff;
}

.search-wrap input {
    width: 100%;
    height: 100%;

    border: none;
    outline: none;

    padding: 0 14px 0 18px;

    font-size: 14px;
    color: #111;
}

.search-wrap input::placeholder {
    color: #777;
}

.search-wrap button {
    width: 48px;
    height: 100%;

    font-size: 27px;
    line-height: 1;

    transform: rotate(-15deg);
}


/* =========================
   КАТЕГОРИИ
========================= */

.categories {
    display: grid;
    grid-template-columns: repeat(4, 1fr);

    gap: 24px;

    max-width: 620px;

    margin: 30px auto 24px;
}

.category {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 7px;

    padding: 4px 5px;

    font-size: 13px;
    font-weight: 700;

    border-radius: 12px;

    transition: 0.2s;
}

.category:hover {
    transform: translateY(-2px);
}

.category.active {
    background: #f4f4f4;
    transform: translateY(-2px);
}

.icon {
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 38px;
    line-height: 1;
    font-weight: 900;
}


/* =========================
   КАРТОЧКИ
========================= */

.cards {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 18px;
}

.card {
    overflow: hidden;

    border-radius: 3px;

    background: #eee;

    cursor: pointer;

    transition: 0.2s;
}

.card:hover {
    transform: translateY(-3px);

    box-shadow:
        0 7px 18px rgba(0, 0, 0, 0.12);
}


/* =========================
   МЕСТО ДЛЯ ФОТО
========================= */

.photo-placeholder {
    aspect-ratio: 1.35 / 1;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #ededed,
            #cfcfcf
        );

    color: #777;

    font-size: 15px;
    font-weight: 700;
}

.photo-placeholder span {
    border: 2px dashed #999;

    padding: 8px 16px;

    border-radius: 7px;
}


/* =========================
   ИНФОРМАЦИЯ КАРТОЧКИ
========================= */

.card-info {
    min-height: 47px;

    padding: 8px 10px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    gap: 2px;

    background: #eee;

    font-size: 13px;
}

.card-info strong {
    font-size: 12px;
}


/* =========================
   НИЧЕГО НЕ НАЙДЕНО
========================= */

.empty {
    display: none;

    text-align: center;

    margin-top: 35px;

    color: #777;

    font-weight: 700;
}


/* =========================
   НИЖНЕЕ МЕНЮ
========================= */

.bottom-nav {
    position: fixed;

    z-index: 10;

    left: 50%;
    bottom: 14px;

    transform: translateX(-50%);

    width: min(92%, 420px);

    height: 72px;

    padding: 7px 28px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    border: 2px solid #111;

    border-radius: 24px;

    background: rgba(255, 255, 255, 0.97);

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.12);
}

.bottom-item {
    min-width: 70px;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 2px;

    font-weight: 800;
}

.bottom-item span {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;
    line-height: 1;
}

.bottom-item small {
    font-size: 11px;
}

.bottom-item.active span {
    transform: scale(1.08);
}


/* =========================
   ПК
========================= */

@media (min-width: 800px) {

    .app {
        padding-top: 55px;
    }

    .header h1 {
        font-size: 25px;
    }

    .search-wrap {
        width: 350px;
        height: 36px;
    }

    .search-wrap input {
        font-size: 12px;
    }

    .categories {
        margin-top: 22px;
        margin-bottom: 12px;

        max-width: 500px;

        gap: 30px;
    }

    .category {
        font-size: 11px;
    }

    .icon {
        font-size: 34px;
    }

    .cards {
        gap: 12px;
    }

    .card-info {
        min-height: 40px;

        font-size: 11px;

        padding: 5px 8px;
    }

    .card-info strong {
        font-size: 10px;
    }

    .bottom-nav {
        position: static;

        transform: none;

        margin: 55px auto 0;

        width: min(100%, 450px);
    }
}


/* =========================
   ТЕЛЕФОН
========================= */

@media (max-width: 600px) {

    .app {
        padding: 24px 18px 105px;
    }

    .header h1 {
        font-size: 22px;
    }

    .search-wrap {
        height: 35px;
    }

    .search-wrap input {
        font-size: 11px;
    }

    .search-wrap button {
        font-size: 22px;
        width: 40px;
    }

    .categories {
        gap: 8px;

        margin-top: 27px;
    }

    .category {
        font-size: 10px;
    }

    .icon {
        font-size: 31px;
        height: 34px;
    }

    .cards {
        grid-template-columns: repeat(2, 1fr);

        gap: 10px;
    }

    .card:nth-child(3) {
        display: none;
    }

    .card-info {
        min-height: 43px;

        font-size: 10px;
    }

    .card-info strong {
        font-size: 9px;
    }

    .bottom-nav {
        height: 62px;

        bottom: 10px;

        border-radius: 19px;
    }
}
</style>
</head>


<body>

<main class="app">


    <!-- =========================
         ЗАГОЛОВОК
    ========================== -->

    <header class="header">

        <h1>
            Турагентство<br>
            Кашалот
        </h1>


        <!-- ПОИСК -->

        <div class="search-wrap">

            <input
                id="searchInput"
                type="search"
                placeholder="Поиск направлений, рейсов"
            >

            <button
                id="searchBtn"
                aria-label="Поиск"
            >
                ⌕
            </button>

        </div>

    </header>



    <!-- =========================
         КАТЕГОРИИ
    ========================== -->

    <nav
        class="categories"
        aria-label="Категории"
    >

        <button
            class="category active"
            data-category="flights"
        >

            <span class="icon">
                ✈
            </span>

            <span>
                Рейсы
            </span>

        </button>


        <button
            class="category"
            data-category="hotels"
        >

            <span class="icon">
                ⌂
            </span>

            <span>
                Отели
            </span>

        </button>


        <button
            class="category"
            data-category="tours"
        >

            <span class="icon">
                ⚓
            </span>

            <span>
                Туры
            </span>

        </button>


        <button
            class="category"
            data-category="restaurants"
        >

            <span class="icon">
                ▥
            </span>

            <span>
                Рестораны
            </span>

        </button>

    </nav>



    <!-- =========================
         КАРТОЧКИ
    ========================== -->

    <section
        class="cards"
        id="cards"
    >


        <!-- КАРТОЧКА 1 -->

        <article
            class="card"
            data-search="Киото Япония рейс"
        >

          <div class="photo-placeholder">
          <img src="2.jpeg" alt="Киото Япония">
          </div>



            <div class="card-info">

                <span>
                    Киото, Япония
                </span>

                <strong>
                    5.0 ⭐
                </strong>

            </div>

        </article>



        <!-- КАРТОЧКА 2 -->

        <article
            class="card"
            data-search="Дубай ОАЭ отель"
        >

            <div class="photo-placeholder">
          <img src="3.jpeg" alt="Дубай, ОАЭ">
          </div>



            <div class="card-info">

                <span>
                    Дубай, ОАЭ
                </span>

                <strong>
                    5.0 ⭐
                </strong>

            </div>

        </article>



        <!-- КАРТОЧКА 3 -->

        <article
            class="card"
            data-search="Пхукет Таиланд тур"
        >

        <div class="photo-placeholder">
          <img src="1.jpeg" alt="Пхукет, Таиланд">
          </div>


            <div class="card-info">

                <span>
                    Пхукет, Таиланд
                </span>

                <strong>
                    5.0 ⭐
                </strong>

            </div>

        </article>

    </section>



    <!-- ЕСЛИ НИЧЕГО НЕ НАЙДЕНО -->

    <p
        class="empty"
        id="emptyMessage"
    >
        Ничего не найдено
    </p>



    <!-- =========================
         НИЖНЕЕ МЕНЮ
    ========================== -->

    <nav
        class="bottom-nav"
        aria-label="Основная навигация"
    >

        <button
            class="bottom-item active"
            data-page="home"
        >

            <span>
                ⌂
            </span>

            <small>
                Меню
            </small>

        </button>


        <button
            class="bottom-item"
            data-page="search"
        >

            <span>
                ⌕
            </span>

            <small>
                Поиск
            </small>

        </button>


        <button
            class="bottom-item"
            data-page="profile"
        >

            <span>
                ●
            </span>

            <small>
                Профиль
            </small>

        </button>

    </nav>

</main>



<script>

/* =========================
   ПОЛУЧАЕМ ЭЛЕМЕНТЫ
========================= */

const searchInput =
    document.getElementById("searchInput");

const searchBtn =
    document.getElementById("searchBtn");

const cards =
    [...document.querySelectorAll(".card")];

const emptyMessage =
    document.getElementById("emptyMessage");

const categories =
    document.querySelectorAll(".category");

const bottomItems =
    document.querySelectorAll(".bottom-item");



/* =========================
   ПОИСК
========================= */

function filterCards() {

    const query =
        searchInput.value
        .trim()
        .toLowerCase();

    let visible = 0;


    cards.forEach(card => {

        const text =
            card.dataset.search.toLowerCase();

        const match =
            !query ||
            text.includes(query);


        card.style.display =
            match ? "" : "none";


        if (match) {
            visible++;
        }

    });


    emptyMessage.style.display =
        visible ? "none" : "block";
}



/* =========================
   ПОИСК ПРИ ВВОДЕ
========================= */

searchInput.addEventListener(
    "input",
    filterCards
);



/* =========================
   КНОПКА ПОИСКА
========================= */

searchBtn.addEventListener(
    "click",
    filterCards
);



/* =========================
   КАТЕГОРИИ
========================= */

categories.forEach(category => {

    category.addEventListener(
        "click",
        () => {

            categories.forEach(item => {

                item.classList.remove(
                    "active"
                );

            });


            category.classList.add(
                "active"
            );

        }
    );

});



/* =========================
   НИЖНЕЕ МЕНЮ
========================= */

bottomItems.forEach(item => {

    item.addEventListener(
        "click",
        () => {

            bottomItems.forEach(button => {

                button.classList.remove(
                    "active"
                );

            });


            item.classList.add(
                "active"
            );


            const page =
                item.dataset.page;



            /* МЕНЮ */

            if (page === "home") {

                searchInput.value = "";

                filterCards();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }



            /* ПОИСК */

            if (page === "search") {

                searchInput.focus();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }



            /* ПРОФИЛЬ */

            if (page === "profile") {

                alert(
                    "Профиль пока находится в разработке."
                );

            }

        }
    );

});



/* =========================
   КЛИК ПО КАРТОЧКЕ
========================= */

cards.forEach(card => {

    card.addEventListener(
        "click",
        () => {

            const title =
                card
                .querySelector(
                    ".card-info span"
                )
                .textContent;


            alert(
                "Вы выбрали: " + title
            );

        }
    );

});

</script>

</body>
</html>
